     One question engine: a card is made by a small generator (pick a note, draw it, the wrong answers are notes near it).
     Free: no code screen. Nothing is sent anywhere except an anonymous count to the site's Analytics when it has one.
     It is opened by the play page with ?app=cards (the player steps aside), and later by its own page.
     The fingering diagrams are the booklets' own: tools/export_fingerings.py writes the block between the FINGERINGS markers. -->

    whites.forEach(function (p, i) { out += '<rect class="w' + (p === pc ? " on" : "") + '" x="' + (1 + i * W) + '" y="1" width="' + W + '" height="' + H + '" rx="2"/>'; });
    blacks.forEach(function (b) { out += '<rect class="b' + (b[0] === pc ? " on" : "") + '" x="' + (1 + b[1] * W - 7) + '" y="1" width="14" height="' + H * 0.62 + '" rx="1.5"/>'; });
    return '<svg class="kb" viewBox="0 0 ' + (7 * W + 2) + " " + (H + 2) + '" role="img" aria-label="A piano key">' + out + "</svg>";
  }
  var pcOf = function (n) { return ((n.m % 12) + 12) % 12; };
  var fingId = function (n) { return FGS[S.inst].fing[n.m][0].join(","); };

  // ---------- one card: what is shown, what is asked, the answers
  // "same" says when two notes would be the same answer on this kind of card (a B is a B in any octave when the answer is a letter).
  var KIND = {
    name: { ask: "Which note is this?", same: nameOf, show: staffEl, face: function (n) { return document.createTextNode(nameOf(n)); }, sort: true },
    key: { ask: "Which key plays this note?", same: pcOf, show: staffEl, face: function (n) { return html(keySvg(pcOf(n))); } },
    fing: { ask: "Which fingering plays this note?", same: fingId, show: staffEl, face: function (n) { return html(fingerSvg(FGS[S.inst], n.m)); } },
    staff: { ask: "", same: function (n) { return S.inst === "piano" ? pcOf(n) : fingId(n); },
             show: function (n) { return S.inst === "piano" ? html(keySvg(pcOf(n))) : html(fingerSvg(FGS[S.inst], n.m)); }, face: staffEl }
  };
  function html(s) { var t = document.createElement("div"); t.innerHTML = s; return t.firstChild; }
  function makeCard(P, last) {
    var K = KIND[S.mode], L = LEVELS[S.level];
    var w = P.map(function (n) { return idOf(n) === last ? 0 : 1 + 2 * (mem.miss[S.mode + "|" + idOf(n)] || 0); });   // notes that went wrong come back more often
    var tot = w.reduce(function (a, b) { return a + b; }, 0), r = Math.random() * tot, i = 0; while (i < P.length - 1 && (r -= w[i]) > 0) i++;
    var ans = P[i], seen = {}, near = []; seen[K.same(ans)] = 1;
    P.filter(function (n) { return n.clef === ans.clef; }).sort(function (x, y) { return Math.abs(x.m - ans.m) - Math.abs(y.m - ans.m) || Math.random() - 0.5; })
      .forEach(function (n) { var k = K.same(n); if (!seen[k]) { seen[k] = 1; near.push(n); } });
    var wrong = shuffle(near.slice(0, Math.max(L.n + 1, 5))).slice(0, L.n - 1), opts = shuffle([ans].concat(wrong));
    if (K.sort) opts.sort(function (x, y) { return nameOf(x) < nameOf(y) ? -1 : 1; });
    return { ans: ans, opts: opts };
  }

  // ---------- the setup screen
  function seg(el, items, cur, pick) {
    el.innerHTML = ""; el.style.setProperty("--k", items.length);
    items.forEach(function (it) { var b = document.createElement("button"); b.type = "button"; b.textContent = it[1]; if (it[2]) b.setAttribute("aria-label", it[2]); b.dataset.id = it[0]; b.setAttribute("aria-pressed", String(it[0]) === String(cur)); b.onclick = function () { pick(it[0]); }; el.appendChild(b); });
  }
  var bestKey = function () { return [S.inst, S.mode, FGS[S.inst] ? "treble" : S.clef, S.level, S.round].join("|"); };
  function setup() {
    if (MODES_FOR[S.inst].indexOf(S.mode) < 0) S.mode = "name";
    seg($("inst"), INSTS, S.inst, function (v) { S.inst = v; setup(); });
    seg($("mode"), MODES_FOR[S.inst].map(function (m) { return [m, MODES[m]]; }), S.mode, function (v) { S.mode = v; setup(); });
    $("clef-grp").hidden = !!FGS[S.inst];
    seg($("clef"), [["treble", "Treble"], ["bass", "Bass"], ["both", "Both"]], S.clef, function (v) { S.clef = v; setup(); });
    seg($("level"), [1, 2, 3, 4].map(function (l) { return [l, LEVELS[l].name]; }), S.level, function (v) { S.level = +v; setup(); });
    $("level-note").textContent = LEVELS[S.level].note;
    seg($("round"), ROUNDS, S.round, function (v) { S.round = v; setup(); });
    var b = mem.best[bestKey()]; $("best").textContent = b ? "Your best with these settings: " + b + (S.round === "sprint" ? " in 60 seconds" : " out of 20") : "";
    save();
  }

  // ---------- a round
  var G = null, SPRINT = 60, CALM = 20;
  function start() {
    G = { P: pool(), right: 0, asked: 0, t0: 0, last: "", wrongs: {}, lock: false, timer: null, card: null, shownAt: 0 };
    $("setup").hidden = true; $("done").hidden = true; $("game").hidden = false;
    $("fill").style.transform = "scaleX(" + (S.round === "sprint" ? 1 : 0) + ")"; $("clock").textContent = S.round === "sprint" ? "1:00" : "";
    next();
    track("aam_cards_start", { inst: S.inst, mode: S.mode, level: S.level, clef: S.clef, round: S.round });
  }
  function tick() {
    if (!G) return;
    var left = SPRINT - (Date.now() - G.t0) / 1000;
    if (left <= 0) return finish();
    $("fill").style.transform = "scaleX(" + left / SPRINT + ")"; var s = Math.ceil(left); $("clock").textContent = s >= 60 ? "1:00" : "0:" + (s < 10 ? "0" : "") + s;
  }
  function next() {
    if (S.round === "calm" && G.asked >= CALM) return finish();
    var c = G.card = makeCard(G.P, G.last), K = KIND[S.mode]; G.last = idOf(c.ans); G.lock = false; G.shownAt = Date.now();
    $("ask").textContent = K.ask || (S.inst === "piano" ? "Which note is this key?" : "Which note is this fingering?");
    $("count").textContent = G.right + " right"; $("said").textContent = ""; $("said").className = "said";
    var show = $("show"); show.innerHTML = ""; show.appendChild(K.show(c.ans));
    var box = $("opts"); box.innerHTML = ""; box.style.setProperty("--n", c.opts.length); box.className = "opts" + (S.mode === "staff" || (S.mode === "key" && c.opts.length > 3) ? " pics" : "");
    c.opts.forEach(function (n, i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.dataset.i = i; b.appendChild(K.face(n));
      if (S.mode !== "name") b.setAttribute("aria-label", "Answer " + (i + 1)); else b.setAttribute("aria-label", said(n));
      b.onclick = function () { answer(i); }; box.appendChild(b);
    });
    if (S.round === "calm") $("fill").style.transform = "scaleX(" + G.asked / CALM + ")";
  }
  function answer(i) {
    if (!G || G.lock || !G.card.opts[i]) return;
    if (!G.t0) { G.t0 = Date.now(); if (S.round === "sprint") G.timer = setInterval(tick, 100); }     // the clock starts with the first answer
    G.lock = true; G.asked++;
    var c = G.card, ok = c.opts[i] === c.ans, k = S.mode + "|" + idOf(c.ans), btns = root.querySelectorAll(".opt"), slow = Date.now() - G.shownAt > 4000;
    btns[c.opts.indexOf(c.ans)].classList.add("right");
    if (ok) { G.right++; if (!slow && mem.miss[k]) { mem.miss[k]--; if (!mem.miss[k]) delete mem.miss[k]; } }
    else { btns[i].classList.add("wrong"); mem.miss[k] = Math.min(5, (mem.miss[k] || 0) + 2); G.wrongs[idOf(c.ans)] = { n: c.ans, x: ((G.wrongs[idOf(c.ans)] || {}).x || 0) + 1 }; }
    $("said").textContent = ok ? "Yes" : "It is " + said(c.ans); $("said").className = "said " + (ok ? "good" : "bad");
    $("count").textContent = G.right + " right";
    setTimeout(function () { if (G) next(); }, ok ? 220 : 1100);
  }
  function finish() {
    if (!G) return;
    clearInterval(G.timer);
    var secs = G.t0 ? Math.min(S.round === "sprint" ? SPRINT : 1e9, (Date.now() - G.t0) / 1000) : 0, acc = G.asked ? Math.round(100 * G.right / G.asked) : 0, bk = bestKey(), was = mem.best[bk] || 0;
    if (G.right > was) mem.best[bk] = G.right; save();
    $("game").hidden = true; $("done").hidden = false;
    $("done-h").textContent = G.right > was && was ? "A new best" : "Round over";
    $("score").textContent = G.right; $("score-note").textContent = S.round === "sprint" ? "right in 60 seconds" : "right out of " + G.asked;
    $("s-acc").textContent = acc + "%"; $("s-rate").textContent = secs > 3 ? Math.round(G.asked / secs * 60) : "–"; $("s-best").textContent = mem.best[bk] || 0;
    var w = Object.keys(G.wrongs).map(function (k) { return G.wrongs[k]; }).sort(function (a, b) { return b.x - a.x; }).slice(0, 3), box = $("work"); box.innerHTML = "";
    $("work-grp").hidden = !w.length;
    w.forEach(function (o) { var d = document.createElement("div"); d.appendChild(staffEl(o.n)); d.appendChild(document.createTextNode(nameOf(o.n))); box.appendChild(d); });
    track("aam_cards_round", { inst: S.inst, mode: S.mode, level: S.level, clef: S.clef, round: S.round, score: G.right, asked: G.asked, accuracy: acc });
    G = null;
  }
  $("start").onclick = start; $("again").onclick = start;
  $("change").onclick = function () { $("done").hidden = true; $("setup").hidden = false; setup(); };
  $("quit").onclick = function () { if (G && G.asked) finish(); else { if (G) clearInterval(G.timer); G = null; $("game").hidden = true; $("setup").hidden = false; setup(); } };
  document.addEventListener("keydown", function (e) {      // a keyboard: 1 to 4 pick an answer; on letter cards the letter itself does too
    if (!G || G.lock || e.metaKey || e.ctrlKey || e.altKey) return;
    var i = "1234".indexOf(e.key);
    if (i < 0 && S.mode === "name" && /^[a-g]$/i.test(e.key)) { var hits = G.card.opts.filter(function (n) { return letter(n) === e.key.toUpperCase(); }); if (hits.length === 1) i = G.card.opts.indexOf(hits[0]); }
    if (i >= 0 && G.card.opts[i]) { e.preventDefault(); answer(i); }
  });
  setup();
})();
</script>
