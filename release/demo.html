<!-- Alex Attard Music: the public DEMO card (test copy; the site loads release/demo.html through player/demo-loader.html).
     A light poster on the lessons page. The player and its sounds load only when someone taps it, inside a frame of its own,
     so the theme's styles and the player never touch each other. -->
<div id="aam-demo" class="aam-demo">
  <style>
    /* every text property is set here, so the site's theme can't restyle the card */
    div.aam-demo, div.aam-demo * { box-sizing: border-box; letter-spacing: normal; text-transform: none; word-spacing: normal; }
    div.aam-demo { max-width: 1100px; margin: 0 auto; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
    div.aam-demo .poster { display: flex; gap: 16px; align-items: center; width: 100%; margin: 0; padding: 16px 18px; border: 1px solid #cfe6f7; border-radius: 16px;
      background: linear-gradient(135deg, #e8f5fe 0%, #f6fbff 100%); text-align: left; cursor: pointer; color: #0f1419; font: inherit; white-space: normal;
      box-shadow: none; transition: box-shadow .15s ease, transform .15s ease; }
    div.aam-demo .poster:hover, div.aam-demo .poster:focus-visible { box-shadow: 0 8px 22px rgba(29, 155, 240, .2); transform: translateY(-1px); outline: none; background: linear-gradient(135deg, #e8f5fe 0%, #f6fbff 100%); color: #0f1419; }
    div.aam-demo .ic { flex: none; width: 54px; height: 54px; border-radius: 50%; background: #1d9bf0; display: grid; place-items: center; box-shadow: 0 5px 14px rgba(29, 155, 240, .35); }
    div.aam-demo .ic svg { width: 22px; height: 22px; margin-left: 4px; fill: #fff; }
    div.aam-demo .tx { min-width: 0; }
    div.aam-demo .k { display: block; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #0f6fb5; line-height: 1.3; margin-bottom: 2px; }
    div.aam-demo .t { display: block; font-size: 19px; font-weight: 700; line-height: 1.25; margin-bottom: 3px; }
    div.aam-demo .d { display: block; font-size: 14px; font-weight: 400; line-height: 1.45; color: #536471; }
    div.aam-demo iframe { display: block; width: 100%; height: min(700px, 86vh); border: 1px solid #cfe6f7; border-radius: 16px; background: #e8f5fe; }
    /* in a narrow column on a big screen the band opens in a window over the page instead of squeezing in */
    #aam-demo-modal { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: 3vh 3vw; background: rgba(15, 20, 25, .6); }
    #aam-demo-modal .win { position: relative; width: min(1180px, 100%); height: min(760px, 100%); }
    #aam-demo-modal iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 16px; background: #e8f5fe; box-shadow: 0 24px 60px rgba(0, 0, 0, .4); }
    #aam-demo-modal .x { position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; color: #0f1419; font: 700 18px/36px system-ui, sans-serif; text-align: center; padding: 0; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); }
    /* on a phone the band opens in the page and is exactly one screen tall, so the title and the play button are both in view */
    @media (max-width: 899px) { div.aam-demo iframe { height: 86vh; height: calc(100svh - 20px); max-height: 760px; border-radius: 14px; } div.aam-demo { scroll-margin-top: 10px; } }
    /* on a phone the band takes the whole screen, with one bar on top to go back to the page: nothing of the page can sit over its buttons */
    #aam-demo-modal.full { display: block; padding: 0; background: #e8f5fe; }
    #aam-demo-modal.full .win { display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh; }
    #aam-demo-modal.full iframe, #aam-demo-modal.full .intro { flex: 1 1 auto; min-height: 0; height: auto; border-radius: 0; box-shadow: none; }
    #aam-demo-modal.full .x { position: static; flex: none; width: 100%; height: 44px; border-radius: 0; background: #0f1419; color: #fff; font: 600 15px/44px "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: left; padding: 0 16px; box-shadow: none; }
    /* the note before the band opens: how a student uses the player */
    .aam-demo .intro, #aam-demo-modal .intro { box-sizing: border-box; display: block; width: 100%; overflow: auto; padding: 26px 24px 24px; border: 1px solid #cfe6f7; border-radius: 16px; background: #fff; color: #0f1419;
      font: 400 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: left; letter-spacing: normal; text-transform: none; }
    #aam-demo-modal .intro { height: 100%; border: 0; box-shadow: 0 24px 60px rgba(0, 0, 0, .4); }
    #aam-demo-modal:not(.full) .win.note { width: min(560px, 100%); height: auto; max-height: 100%; }
    .intro .in { max-width: 520px; margin: 0 auto; }
    /* a host page's own styles for p and button must not reach the note */
    div.aam-demo .intro p, #aam-demo-modal .intro p { font-size: 15.5px !important; line-height: 1.45 !important; max-width: none !important; }
    div.aam-demo .intro p.sm, #aam-demo-modal .intro p.sm { font-size: 13px !important; }
    div.aam-demo .intro button.go, #aam-demo-modal .intro button.go { display: block !important; width: 100% !important; height: auto !important; min-height: 52px !important; padding: 0 20px !important; border-radius: 999px !important; line-height: 52px !important; font-size: 17px !important; box-shadow: none !important; white-space: nowrap !important; }
    @media (max-width: 899px) { .aam-demo .intro { padding: 18px 18px 18px; } .aam-demo .intro .h { font-size: 21px; margin-bottom: 8px; } .aam-demo .intro p { font-size: 15px; line-height: 1.45; margin-bottom: 10px; }
      .aam-demo .intro li { padding: 9px 0; font-size: 14.5px; line-height: 1.4; } .aam-demo .intro .sm { font-size: 13px; margin-bottom: 12px; } .aam-demo .intro img.shot { max-width: 250px; } }
    .intro .k { display: block; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #0f6fb5; margin: 0 0 6px; }
    .intro .h { margin: 0 0 10px; padding: 0; font: 700 24px/1.2 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f1419; letter-spacing: normal; text-transform: none; }
    .intro p { margin: 0 0 16px; padding: 0; font-size: 16px; line-height: 1.5; color: #334155; }
    .intro ol { list-style: none; margin: 0 0 16px; padding: 0; }
    .intro li { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 12px 0; border-top: 1px solid #e3eef7; font-size: 15.5px; line-height: 1.45; color: #334155; }
    .intro li b { display: block; color: #0f1419; font-weight: 700; }
    .intro li i { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #1d9bf0; color: #fff; font: 700 14px/28px "Inter", system-ui, sans-serif; text-align: center; font-style: normal; }
    .intro img.shot { display: block; width: 100%; max-width: 360px; height: auto; margin: 8px 0 2px; border: 1px solid #cfe6f7; border-radius: 10px; background: #fff; box-shadow: none; }
    .intro li span { flex: 1 1 auto; min-width: 0; }
    .intro .sm { font-size: 13.5px; color: #536471; margin: 0 0 18px; }
    .intro .go { display: block; width: 100%; min-height: 52px; margin: 0; padding: 0 20px; border: 0; border-radius: 999px; background: #1d9bf0; color: #fff; font: 700 17px/52px "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; cursor: pointer; box-shadow: 0 6px 16px rgba(29, 155, 240, .35); letter-spacing: normal; text-transform: none; }
    .intro .go:hover, .intro .go:focus-visible { background: #0f8be0; color: #fff; outline: none; }
  </style>
  <button class="poster" type="button" aria-label="Try the play-along band">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>
    <span class="tx">
      <span class="k">Try it now · free</span>
      <span class="t">Play along with the band</span>
      <span class="d">Jingle Bells, Ode to Joy and five more, at any tempo, written for your instrument.</span>
    </span>
  </button>
</div>

    var n = document.createElement("div"); n.className = "intro";
    n.innerHTML = '<div class="in"><span class="k">How my students practice</span><div class="h" role="heading" aria-level="2">Every lesson ends with a practice PDF that opens in this player.</div>' +
      "<p>Every exercise on it opens right here. This is the order to practice in:</p>" +
      '<ol><li><i>1</i><span><b>Learn the notes</b>The player listens and waits for each right note. Green is played, blue is next, and the fingering is on screen.<img class="shot" alt="Learn mode on a saxophone line: the notes already played are green, the next note sits in a blue cloud, and its fingering is shown." width="792" height="568" src="' + LEARN_SHOT + '"></span></li>' +

      "<li><i>3</i><span><b>Speed up</b>Start slow, then raise the tempo a little each day.</span></li></ol>" +
      '<p class="sm">This free demo has the play-along and the tempo. Learn mode comes with the lesson PDFs.</p>' +
      '<button class="go" type="button">Start playing</button></div>';
